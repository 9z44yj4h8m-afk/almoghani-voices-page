let activeGroup='الكل',hls=null;
const favorites=new Set(JSON.parse(localStorage.getItem('almoghaniFavorites')||'[]'));
function saveFavorites(){localStorage.setItem('almoghaniFavorites',JSON.stringify([...favorites]))}
function getGroups(){return ['الكل','المفضلة',...new Set(channels.map(c=>c.group))]}
function renderGroups(){const box=document.getElementById('groups');box.replaceChildren();getGroups().forEach(group=>{const b=document.createElement('button');b.className='group'+(activeGroup===group?' active':'');b.textContent=group;b.onclick=()=>{activeGroup=group;render()};box.append(b)})}
function render(){renderGroups();const query=document.getElementById('search').value.toLowerCase();const box=document.getElementById('channels');box.replaceChildren();const filtered=channels.filter(c=>(activeGroup==='الكل'||activeGroup==='المفضلة'&&favorites.has(c.name)||c.group===activeGroup)&&c.name.toLowerCase().includes(query));document.getElementById('count').textContent=channels.length+' قناة في القائمة';document.getElementById('sectionTitle').textContent='📡 '+activeGroup+' — '+filtered.length;filtered.forEach(channel=>{const card=document.createElement('div');card.className='card';card.tabIndex=0;card.setAttribute('role','button');const icon=document.createElement('div');if(channel.logo&&/^https?:\/\//i.test(channel.logo)){const img=document.createElement('img');img.className='channel-logo';img.src=channel.logo;img.alt=channel.name;img.loading='lazy';img.onerror=()=>{icon.replaceChildren();icon.textContent='📺';icon.className='placeholder'};icon.append(img)}else{icon.className='placeholder';icon.textContent='📺'}const name=document.createElement('div');name.className='channel-name';name.textContent=channel.name;const badge=document.createElement('span');badge.className='live';badge.textContent='LIVE';const fav=document.createElement('button');fav.type='button';fav.className='fav'+(favorites.has(channel.name)?' selected':'');fav.textContent=favorites.has(channel.name)?'★':'☆';fav.onclick=e=>{e.stopPropagation();favorites.has(channel.name)?favorites.delete(channel.name):favorites.add(channel.name);saveFavorites();render()};card.append(icon,name,badge,fav);card.onclick=()=>playChannel(channel);card.onkeydown=e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();playChannel(channel)}};box.append(card)})}
function importM3U(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).split(/\r?\n/);let current=null;const imported=[];for(const raw of lines){const line=raw.trim();if(line.startsWith('#EXTINF:')){const gm=line.match(/group-title="([^"]*)"/),lm=line.match(/tvg-logo="([^"]*)"/);current={name:line.includes(',')?line.substring(line.indexOf(',')+1).trim():'قناة',group:gm?gm[1]:'قنوات أخرى',logo:lm?lm[1]:'',url:''}}else if(current&&/^https?:\/\//i.test(line)){current.url=line;imported.push(current);current=null}}const existing=new Set(channels.map(c=>c.name+'|'+c.url));let added=0;imported.forEach(c=>{const key=c.name+'|'+c.url;if(!existing.has(key)){channels.push(c);existing.add(key);added++}});activeGroup='الكل';render();alert('تمت إضافة '+added+' قناة جديدة')};reader.readAsText(file,'UTF-8')}
function youtubeEmbed(url){try{const u=new URL(url),host=u.hostname.toLowerCase();let id='';if(host==='youtu.be')id=u.pathname.slice(1).split('/')[0];else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){id=u.searchParams.get('v')||'';if(!id&&(/^\/(live|embed|shorts)\//).test(u.pathname))id=u.pathname.split('/')[2]}if(/^[A-Za-z0-9_-]{11}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id}catch(e){}return null}
function closePlayer(){const video=document.getElementById('video'),iframe=document.getElementById('iframe');video.pause();video.removeAttribute('src');video.load();iframe.src='about:blank';if(hls){hls.destroy();hls=null}document.getElementById('overlay').classList.remove('open')}
function playChannel(channel){closePlayer();const overlay=document.getElementById('overlay'),video=document.getElementById('video'),iframe=document.getElementById('iframe'),status=document.getElementById('status');overlay.classList.add('open');document.getElementById('playerTitle').textContent=channel.name;video.classList.remove('hidden');iframe.classList.add('hidden');status.textContent='جاري الاتصال بالبث...';const url=channel.url,embed=youtubeEmbed(url);if(embed){video.classList.add('hidden');iframe.classList.remove('hidden');iframe.src=embed+'?autoplay=1';status.textContent='قد يمنع ناشر الفيديو تضمينه داخل المواقع.';return}if(/\.m3u8(?:[?#]|$)/i.test(url)){if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().then(()=>status.textContent='').catch(()=>status.textContent='اضغط تشغيل لبدء البث.');return}if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>status.textContent='').catch(()=>status.textContent='اضغط تشغيل لبدء البث.'));hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)status.textContent='تعذر تشغيل القناة؛ قد يكون المصدر متوقفًا أو يمنع العرض.'});return}}video.src=url;video.play().then(()=>status.textContent='').catch(()=>status.textContent='تعذر تشغيل الرابط في المتصفح.')}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closePlayer()});render();
